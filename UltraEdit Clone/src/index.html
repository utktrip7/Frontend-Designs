<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UltraEdit</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header>
      <div class="navbar">
        <div class="nav-logo">
          <img src="../attributes/UltraEdit_logo.png" alt="Navbar-logo" />
        </div>
        <div class="menu">
          <div class="product menu-items">
            <a href="https://www.google.com">Product</a>
          </div>
          <div class="Buy menu-items">
            <a href="https://www.google.com">Buy</a>
          </div>
          <div class="Renew menu-items">
            <a href="https://www.google.com">Renew</a>
          </div>
          <div class="support menu-items">
            <a href="https://www.google.com">Support</a>
          </div>
          <div class="Learn menu-items">
            <a href="https://www.google.com">Learn</a>
          </div>
          <div class="Company menu-items">
            <a href="https://www.google.com">Company</a>
          </div>
        </div>
        <div class="nav-buttons">
          <div class="download">
            <button class="nav-download">Download</button>
            <div class="nav-language">
              <i class="fa-solid fa-globe"></i>
              English
            </div>
            <div class="search">
              <i class="fa-solid fa-magnifying-glass"></i>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <div class="top">
        <div class="heading">
          <h1>Download UltraEdit</h1>
        </div>
        <div class="top-para">
          <p>
            Choose your operating system and download the latest version of the
            editor.
          </p>
          <p>New users get a free 7-day trial after downloading UltraEdit.</p>
        </div>
      </div>
      <div class="main-body">
        <div class="windows">
          <i class="fa-brands fa-windows"></i>
          Windows
          <div class="windows-button">
            <button class="windows-download-button">Download</button>
          </div>
        </div>
        <div class="macos">
          <i class="fa-brands fa-apple"></i>
          Mac OS
          <div class="macos-button">
            <button class="macos-download-button">Download</button>
          </div>
        </div>
        <div class="linux">
          <i class="fa-brands fa-linux"></i>
          Linux
          <div class="linux-button">
            <button class="linux-download-button">Download</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
